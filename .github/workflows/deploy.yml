name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Fill config from secrets
        env:
          VIPER_KV_ID: ${{ secrets.VIPER_KV_ID }}
          VIPER_DOMAIN: ${{ secrets.VIPER_DOMAIN }}
        run: |
          test -n "$VIPER_KV_ID" || { echo "VIPER_KV_ID missing"; exit 1; }
          test -n "$VIPER_DOMAIN" || { echo "VIPER_DOMAIN missing"; exit 1; }
          sed -i "s|REPLACE_WITH_KV_ID|$VIPER_KV_ID|" wrangler.toml
          sed -i "s|https://REPLACE_WITH_WORKER_DOMAIN/auth/callback|https://$VIPER_DOMAIN/auth/callback|" wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ADMIN_PASSWORD
            SIGN_SECRET
            BAIDU_CLIENT_ID
            BAIDU_CLIENT_SECRET
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SIGN_SECRET: ${{ secrets.SIGN_SECRET }}
          BAIDU_CLIENT_ID: ${{ secrets.BAIDU_CLIENT_ID }}
          BAIDU_CLIENT_SECRET: ${{ secrets.BAIDU_CLIENT_SECRET }}
