name = "viper"
main = "src/index.js"
compatibility_date = "2026-11-24"

[[kv_namespaces]]
binding = "VIPER_KV"
id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["0 3 * * *"]

# CF Workers Builds: 连接 GitHub 仓库后，Deploy command 填 `npx wrangler deploy`。
# 在 CF 控制台 Project → Settings → Secrets and variables 添加 4 个 Secret:
#   ADMIN_PASSWORD / SIGN_SECRET / BAIDU_CLIENT_ID / BAIDU_CLIENT_SECRET
# 回调地址由代码按请求域名自动生成，无需配置 BAIDU_REDIRECT_URI。
